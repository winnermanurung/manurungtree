<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

<style>
  :root {
    --primary: #000e1e;
    --primary-container: #0e243a;
    --on-primary: #ffffff;
    --on-primary-container: #778ca6;
    --secondary: #b6191a;
    --secondary-container: #d9352f;
    --on-secondary: #ffffff;
    --secondary-fixed: #ffdad6;
    --tertiary: #190900;
    --tertiary-container: #391b00;
    --tertiary-gold: #d97706;
    --surface: #f7f9fb;
    --surface-container-lowest: #ffffff;
    --surface-container-low: #f2f4f6;
    --surface-container: #eceef0;
    --surface-container-high: #e6e8ea;
    --surface-container-highest: #e0e3e5;
    --on-surface: #191c1e;
    --on-surface-variant: #43474d;
    --outline: #74777d;
    --outline-variant: #c4c6cd;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--surface);
    color: var(--on-surface);
    overflow-x: hidden;
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: #f1f5f9;
  }
  ::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }

  /* Tree Diagram & Nodes (D3.js) */
  .tree-container {
    background: radial-gradient(circle, #e2e8f0 1px, transparent 1px);
    background-size: 24px 24px;
  }
  
  .tree-node {
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.2s ease;
  }
  .tree-node:hover {
    filter: drop-shadow(0px 8px 20px rgba(14, 36, 58, 0.18));
  }
  .tree-node:active {
    transform: scale(0.98);
  }

  .tree-link {
    fill: none;
    stroke: #94a3b8;
    stroke-width: 2px;
    stroke-dasharray: 4, 4;
    transition: stroke 0.3s ease;
  }
  .tree-link.solid {
    stroke-dasharray: none;
    stroke: #64748b;
  }

  /* Glassmorphism Panels */
  .glass-header {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  
  .glass-card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(226, 232, 240, 0.8);
  }

  /* Active Sidebar Link */
  .nav-active {
    background-color: #0e243a !important;
    color: #ffffff !important;
    font-weight: 600;
  }
  .nav-active .material-symbols-outlined {
    color: #ffffff !important;
  }

  /* Modal Transition Utilities */
  .modal-backdrop {
    background-color: rgba(0, 14, 30, 0.65);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: opacity 0.25s ease-in-out;
  }

  /* Tabular figures for numbers */
  .num-tabular {
    font-variant-numeric: tabular-nums;
  }

  /* Subtle cultural ulos ribbon animation */
  @keyframes ulosShimmer {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .ulos-gradient {
    background: linear-gradient(90deg, #b6191a, #0e243a, #d97706, #b6191a);
    background-size: 300% 300%;
    animation: ulosShimmer 12s ease infinite;
  }
</style>
