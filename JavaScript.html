// ============================================================================
// INITIALIZATION
// ============================================================================
document.addEventListener('DOMContentLoaded', function() {
  initApp();
});

function initApp() {
  if (AppState.isGasEnvironment) {
    showLoadingScreen(true);
    // Kirim token tersimpan (localStorage) agar session bertahan saat refresh
    var savedToken = null;
    try { savedToken = localStorage.getItem('imanurung_session'); } catch (e) {}
    // Cek session dulu — jika ada, langsung masuk tanpa login
    google.script.run
      .withSuccessHandler(function(sessionResult) {
        if (sessionResult.loggedIn) {
          // Ada session aktif — muat data app
          google.script.run
            .withSuccessHandler(function(appData) {
              showLoadingScreen(false);
              if (appData) {
                populateAppState(appData);
                showAppView();
              } else {
                showLoginView();
              }
            })
            .withFailureHandler(function() {
              showLoadingScreen(false);
              showLoginView();
            })
            .loadAppData(sessionResult.user.email);
        } else {
          showLoadingScreen(false);
          showLoginView();
        }
      })
      .withFailureHandler(function(err) {
        showLoadingScreen(false);
        console.error('checkSession error:', err);
        showLoginView();
      })
      .checkSession(savedToken);
  } else {
    // Mode Preview / Standalone (tanpa GAS)
    console.info('Running in Standalone Preview Mode');
    fallbackToMockData();
  }
}

function showLoadingScreen(show) {
  var loader = document.getElementById('app-loading-screen');
  if (!loader) return;
  loader.classList.toggle('hidden', !show);
}

// Isi AppState dari data yang diterima server
function populateAppState(data) {
  AppState.currentUser = data.currentUser;
  AppState.stats       = data.stats || {};
  AppState.members     = data.members || [];
  AppState.filteredMembers = AppState.members.slice();
  AppState.dues        = data.dues || [];
  AppState.articles    = data.articles || [];
  AppState.filteredArticles = AppState.articles.slice();
  AppState.logs        = data.logs || [];
  AppState.users       = data.users || [];
}

function handleInitialDataSuccess(data) {
  populateAppState(data);
  if (AppState.currentUser && AppState.currentUser.isRegistered) {
    showAppView();
  } else {
    showLoginView();
  }
}

// ============================================================================
// AUTH & VIEW SWITCHING
// ============================================================================
function showLoginView() {
  showLoadingScreen(false);
  document.getElementById('view-login').classList.remove('hidden');
  document.getElementById('view-app').classList.add('hidden');
  // Reset form login
  var emailInput = document.getElementById('login-email');
  var passInput  = document.getElementById('login-password');
  if (emailInput) emailInput.value = '';
  if (passInput)  passInput.value  = '';
}

function showAppView() {
  showLoadingScreen(false);
  document.getElementById('view-login').classList.add('hidden');
  document.getElementById('view-app').classList.remove('hidden');
  updateCurrentUserUI();
  populateRootSelect();
  populateParentSelect();
  renderDashboardData();
  renderMembersTable();
  renderDuesTable();
  renderArticlesGrid();
  renderRoleUsersTable();
  selectMemberById('MNR-2022-00012');
}

// ============
// LOGIN
// ============
function handleManualLogin(e) {
  e.preventDefault();
  var email    = (document.getElementById('login-email') || document.getElementById('login-identifier')).value.trim();
  var password = document.getElementById('login-password').value.trim();

  if (!email || !password) {
    showToast('Login Gagal', 'Email dan password wajib diisi.');
    return;
  }

  if (AppState.isGasEnvironment) {
    var btn = document.querySelector('#loginForm button[type="submit"]');
    if (btn) { btn.disabled = true; btn.textContent = 'Memverifikasi...'; }

    google.script.run
      .withSuccessHandler(function(result) {
        if (btn) { btn.disabled = false; btn.textContent = 'Masuk ke Portal'; }
        if (result.success) {
          // Login berhasil — simpan token agar tahan refresh, lalu muat data app
          try {
            if (result.sessionToken) localStorage.setItem('imanurung_session', result.sessionToken);
          } catch (e) {}
          showLoadingScreen(true);
          google.script.run
            .withSuccessHandler(function(appData) {
              showLoadingScreen(false);
              if (appData) {
                populateAppState(appData);
                showAppView();
                showToast('Selamat Datang', 'Horas! Masuk sebagai ' + AppState.currentUser.name);
              } else {
                showToast('Error', 'Gagal memuat data. Coba lagi.');
              }
            })
            .withFailureHandler(function(err) {
              showLoadingScreen(false);
              showToast('Error', err.message || 'Gagal memuat data.');
            })
            .loadAppData(result.user.email);
        } else {
          showToast('Login Gagal', result.message || 'Email atau password salah.');
        }
      })
      .withFailureHandler(function(err) {
        if (btn) { btn.disabled = false; btn.textContent = 'Masuk ke Portal'; }
        showToast('Error Server', err.message || 'Terjadi kesalahan. Coba lagi.');
      })
      .loginUser(email, password);
  } else {
    // Mode preview: cari di mock data
    var foundUser = AppState.users.find(function(u) {
      return u.Email.toLowerCase() === email.toLowerCase();
    });
    if (foundUser) {
      AppState.currentUser = {
        isRegistered: true, email: foundUser.Email,
        name: foundUser.Nama, role: foundUser.Role,
        memberId: 'MNR-2022-00012',
        permissions: ['dashboard','data-anggota','pohon-silsilah','iuran-keuangan','artikel-berita','role-management']
      };
    } else {
      AppState.currentUser = {
        isRegistered: true, email: email,
        name: 'Demo User', role: 'Admin', memberId: 'MNR-2022-00012',
        permissions: ['dashboard','data-anggota','pohon-silsilah','iuran-keuangan','artikel-berita','role-management']
      };
    }
    showAppView();
    showToast('Masuk Berhasil', 'Horas! Selamat datang.');
  }
}

// ============
// LOGOUT
// ============
function logout() {
  var savedToken = null;
  try { savedToken = localStorage.getItem('imanurung_session'); } catch (e) {}
  try { localStorage.removeItem('imanurung_session'); } catch (e) {}
  if (AppState.isGasEnvironment) {
    google.script.run
      .withSuccessHandler(function() {
        AppState.currentUser = null;
        showLoginView();
        showToast('Keluar', 'Sesi Anda telah diakhiri. Sampai jumpa!');
      })
      .withFailureHandler(function() {
        // Tetap logout di sisi client meski server error
        AppState.currentUser = null;
        showLoginView();
      })
      .logoutUser(savedToken);
  } else {
    AppState.currentUser = null;
    showLoginView();
    showToast('Keluar', 'Sesi Anda telah diakhiri.');
  }
}


function updateCurrentUserUI() {
  var user = AppState.currentUser;
  if (!user) return;
  var nameEl = document.getElementById('userSidebarName');
  var roleEl = document.getElementById('userSidebarRole');
  var avatarEl = document.getElementById('userSidebarAvatar');
  var topAvatarEl = document.getElementById('userTopbarAvatar');

  if (nameEl) nameEl.textContent = user.name;
  if (roleEl) roleEl.textContent = user.role + ' Pengurus';

  // Sembunyikan menu Role Management jika bukan admin
  var btnRoleNav = document.getElementById('btnNav-role-management');
  if (btnRoleNav) {
    if (user.role === 'Admin' || user.role === 'Super Admin') {
      btnRoleNav.classList.remove('hidden');
    } else {
      btnRoleNav.classList.add('hidden');
    }
  }

  // Menu Data Anggota & Iuran hanya untuk Pengurus/Admin/Super Admin
  var staffOnlyNavs = ['btnNav-data-anggota', 'btnNav-iuran-keuangan'];
  staffOnlyNavs.forEach(function(navId) {
    var btn = document.getElementById(navId);
    if (btn) btn.classList.toggle('hidden', !isStaffUser());
  });

  // Kunci tulis: user biasa (Member/Pengurus) hanya read — sembunyikan tombol tulis
  applyWriteLockUI_();

  // Dashboard Member: ringkas (sembunyikan KPI statistik & chart), fokus warta + aktivitas sendiri
  applyMemberDashboardUI_();
}

/**
 * Helper: apakah user saat ini boleh tulis (add/edit)?
 * Hanya Admin & Super Admin.
 */
function isWriteAllowed() {
  var user = AppState.currentUser;
  if (!user) return false;
  return (user.role === 'Admin' || user.role === 'Super Admin');
}

/**
 * Helper: apakah user termasuk staf (Pengurus/Admin/Super Admin)?
 * Staf boleh membuka menu Data Anggota & Iuran. Member tidak.
 */
function isStaffUser() {
  var user = AppState.currentUser;
  if (!user) return false;
  return (user.role === 'Admin' || user.role === 'Super Admin' || user.role === 'Pengurus');
}

/**
 * Sembunyikan semua tombol tulis untuk user read-only.
 * Dipanggil setiap kali user login / tab berganti.
 */
function applyWriteLockUI_() {
  var allowed = isWriteAllowed();
  // Tandai body agar CSS/tooltip bisa menyesuaikan
  try { document.body.classList.toggle('read-only', !allowed); } catch (e) {}

  // Tombol-tombol tulis utama (tambah anggota, catat iuran, tulis artikel)
  var writeBtnSelectors = [
    '[onclick="openAddMemberModal()"]',
    '[onclick="openRecordDuesModal()"]',
    '[onclick="openArticleEditorModal()"]'
  ];
  writeBtnSelectors.forEach(function(sel) {
    document.querySelectorAll(sel).forEach(function(btn) {
      btn.classList.toggle('hidden', !allowed);
    });
  });

  // Tombol edit di drawer detail anggota
  var drawerEdit = document.getElementById('drawerEditBtn');
  if (drawerEdit) drawerEdit.classList.toggle('hidden', !allowed);

  // Tombol edit per-baris di tabel anggota (di-render dinamis — tandai flag)
  AppState.writeLocked = !allowed;
  if (typeof renderMembersTable === 'function') {
    try { renderMembersTable(); } catch (e) {}
  }
}

/**
 * Guard: tolak pembukaan modal tulis untuk user read-only.
 * Return true jika boleh lanjut, false + toast jika ditolak.
 */
function guardWriteAccess_() {
  if (isWriteAllowed()) return true;
  showToast('Akses Ditolak', 'Hanya Admin yang bisa menambah/mengubah data.');

// TAB ROUTING & NAVIGATION
// ============================================================================
function switchViewTab(tabId) {
  var tabs = ['dashboard', 'data-anggota', 'pohon-silsilah', 'iuran-keuangan', 'artikel-berita', 'role-management'];

  // Guard navigasi: Data Anggota & Iuran hanya staf; Role Management hanya admin
  var staffTabs = ['data-anggota', 'iuran-keuangan'];
  if (staffTabs.indexOf(tabId) !== -1 && !isStaffUser()) {
    showToast('Akses Ditolak', 'Menu ini hanya untuk Pengurus dan Admin.');
    return;
  }
  if (tabId === 'role-management' && !isWriteAllowed()) {
    showToast('Akses Ditolak', 'Menu ini hanya untuk Admin.');
    return;
  }

  tabs.forEach(function(t) {
    var el = document.getElementById('tab-' + t);
    var btn = document.getElementById('btnNav-' + t);
    if (el) el.classList.add('hidden');
    if (btn) btn.classList.remove('nav-active');
  });

  var activeEl = document.getElementById('tab-' + tabId);
  var activeBtn = document.getElementById('btnNav-' + tabId);
  if (activeEl) activeEl.classList.remove('hidden');
  if (activeBtn) activeBtn.classList.add('nav-active');

  AppState.currentTab = tabId;

  // Render spesifik saat tab aktif
  if (tabId === 'dashboard') {
    setTimeout(renderDashboardCharts, 100);
  } else if (tabId === 'pohon-silsilah') {
    setTimeout(renderFamilyTree, 100);
  }

  // Tutup sidebar mobile jika terbuka
  var sidebar = document.getElementById('appSidebar');
  if (sidebar && window.innerWidth < 768) {
    sidebar.classList.add('-translate-x-full');
  }
}

function renderDashboardCharts() {
  // 1. Chart Generasi
  var ctxGen = document.getElementById('generasiChart');
  if (ctxGen) {
    if (AppState.charts.generasi) AppState.charts.generasi.destroy();

    var genCounts = {};
    AppState.members.forEach(function(m) {
      var g = 'Sundut ' + (m.Generasi || 16);
      genCounts[g] = (genCounts[g] || 0) + 1;
    });

    var labels = Object.keys(genCounts).sort(function(a, b) {
      return parseInt(a.replace('Sundut ', '')) - parseInt(b.replace('Sundut ', ''));
    });
    var data = labels.map(function(k) { return genCounts[k]; });

    AppState.charts.generasi = new Chart(ctxGen, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Jumlah Anggota',
          data: data,
          backgroundColor: '#0e243a',
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
          x: { grid: { display: false } }
        }
      }
    });
  }

  // 2. Chart Rumpun
  var ctxRumpun = document.getElementById('rumpunChart');
  if (ctxRumpun) {
    if (AppState.charts.rumpun) AppState.charts.rumpun.destroy();

    var rCounts = { Hutagurgur: 0, Hutagaol: 0, Simanoroni: 0 };
    AppState.members.forEach(function(m) {
      var r = m.Rumpun || '';
      if (r.indexOf('Hutagurgur') !== -1) rCounts.Hutagurgur++;
      else if (r.indexOf('Hutagaol') !== -1) rCounts.Hutagaol++;
      else if (r.indexOf('Simanoroni') !== -1) rCounts.Simanoroni++;
    });

    AppState.charts.rumpun = new Chart(ctxRumpun, {
      type: 'doughnut',
      data: {
        labels: ['Hutagurgur', 'Hutagaol', 'Simanoroni'],
        datasets: [{
          data: [rCounts.Hutagurgur, rCounts.Hutagaol, rCounts.Simanoroni],
          backgroundColor: ['#0e243a', '#b6191a', '#d97706'],
          borderWidth: 2,
          borderColor: '#ffffff'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
        }
      }
    });
  }
}

function applyMemberFilters() {
  var search = (document.getElementById('filterMemberSearch')?.value || '').toLowerCase();
  var rumpun = document.getElementById('filterMemberRumpun')?.value || '';
  var sundut = document.getElementById('filterMemberSundut')?.value || '';
  var sektor = document.getElementById('filterMemberSektor')?.value || '';
  var status = document.getElementById('filterMemberStatus')?.value || '';

  AppState.filteredMembers = AppState.members.filter(function(m) {
    var matchSearch = !search ||
      (m.Nama && m.Nama.toLowerCase().indexOf(search) !== -1) ||
      (m.MemberID && m.MemberID.toLowerCase().indexOf(search) !== -1) ||
      (m.Alamat && m.Alamat.toLowerCase().indexOf(search) !== -1);
    
    var matchRumpun = !rumpun || (m.Rumpun && m.Rumpun.indexOf(rumpun) !== -1);
    var matchSundut = !sundut || String(m.Generasi) === String(sundut);
    var matchSektor = !sektor || (m.Sektor && m.Sektor.indexOf(sektor) !== -1);
    var matchStatus = !status || m.Status === status;

    return matchSearch && matchRumpun && matchSundut && matchSektor && matchStatus;
  });

  renderMembersTable();
}

function resetMemberFilters() {
  if (document.getElementById('filterMemberSearch')) document.getElementById('filterMemberSearch').value = '';
  if (document.getElementById('filterMemberRumpun')) document.getElementById('filterMemberRumpun').value = '';
  if (document.getElementById('filterMemberSundut')) document.getElementById('filterMemberSundut').value = '';
  if (document.getElementById('filterMemberSektor')) document.getElementById('filterMemberSektor').value = '';
  if (document.getElementById('filterMemberStatus')) document.getElementById('filterMemberStatus').value = '';
  AppState.filteredMembers = AppState.members.slice();
  renderMembersTable();
}

function renderMembersTable() {
  var tbody = document.getElementById('memberTableBody');
  var badge = document.getElementById('memberCountBadge');
  if (!tbody) return;

  if (badge) badge.textContent = AppState.filteredMembers.length + ' Anggota';

  if (AppState.filteredMembers.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-on-surface-variant">Tidak ada data anggota yang cocok dengan filter.</td></tr>';
    return;
  }

  tbody.innerHTML = AppState.filteredMembers.map(function(m) {
    var isSelected = m.MemberID === AppState.selectedMemberId;
    var rowBg = isSelected ? 'bg-primary/5 font-medium' : 'hover:bg-surface-container-low';
    
    var rumpunColor = 'bg-primary-container/10 text-primary';
    if ((m.Rumpun || '').indexOf('Hutagaol') !== -1) rumpunColor = 'bg-secondary/10 text-secondary';
    if ((m.Rumpun || '').indexOf('Simanoroni') !== -1) rumpunColor = 'bg-amber-50 text-amber-800';

    return '<tr onclick="selectMemberById(\'' + m.MemberID + '\')" class="' + rowBg + ' cursor-pointer transition border-b border-surface-container-high">' +
      '<td class="py-3 px-4">' +
        '<div class="flex items-center gap-3">' +
          '<img src="' + escapeHtml(m.FotoURL || '') + '" class="w-9 h-9 rounded-full object-cover shrink-0 shadow-xs">' +
          '<div class="min-w-0">' +
            '<span class="font-bold text-primary block truncate">' + escapeHtml(m.Nama) + '</span>' +
            '<span class="font-mono text-[10px] text-on-surface-variant">' + escapeHtml(m.MemberID) + '</span>' +
          '</div>' +
        '</div>' +
      '</td>' +
      '<td class="py-3 px-4">' +
        '<div class="flex flex-col gap-0.5">' +
          '<span class="px-2 py-0.5 rounded-full ' + rumpunColor + ' text-[10px] font-bold w-fit">' + escapeHtml(m.Rumpun || 'Manurung') + '</span>' +
          '<span class="text-[10px] text-on-surface-variant font-semibold">Sundut ke-' + (m.Generasi || 16) + '</span>' +
        '</div>' +
      '</td>' +
      '<td class="py-3 px-4 hidden md:table-cell">' +
        '<span class="text-on-surface font-semibold block">' + escapeHtml(m.Sektor || 'Bona Pasogit') + '</span>' +
        '<span class="text-[10px] text-on-surface-variant truncate block">' + escapeHtml(m.Alamat || '') + '</span>' +
      '</td>' +
      '<td class="py-3 px-4">' +
        (m.Status === 'Aktif' 
          ? '<span class="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Aktif</span>'
          : '<span class="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full bg-surface-container text-on-surface-variant"><span class="w-1.5 h-1.5 rounded-full bg-outline"></span>Non-Aktif</span>') +
      '</td>' +
      '<td class="py-3 px-4 text-right whitespace-nowrap">' +
        '<div class="flex items-center justify-end gap-1" onclick="event.stopPropagation()">' +
          (AppState.writeLocked ? '' :
          '<button onclick="openEditMemberModal(\'' + m.MemberID + '\')" title="Edit" class="p-1 rounded hover:bg-surface-container text-primary transition">' +
            '<span class="material-symbols-outlined text-[18px]">edit</span>' +
          '</button>') +
        '</div>' +
      '</td>' +
    '</tr>';
  }).join('');
}

function selectMemberById(memberId) {
  AppState.selectedMemberId = memberId;
  var member = AppState.members.find(function(m) { return m.MemberID === memberId; });
  if (!member) return;

  // Update Drawer UI
  var nameEl = document.getElementById('drawerName');
  var avatarEl = document.getElementById('drawerAvatar');
  var rumpunEl = document.getElementById('drawerRumpun');
  var sundutEl = document.getElementById('drawerSundut');
  var ktaEl = document.getElementById('drawerKta');
  var selfNameEl = document.getElementById('drawerSelfName');
  var pasanganEl = document.getElementById('drawerPasangan');
  var ayahNameEl = document.getElementById('drawerAyahName');
  var ompungNameEl = document.getElementById('drawerOmpungName');
  var pekerjaanEl = document.getElementById('drawerPekerjaan');
  var bonaPasogitEl = document.getElementById('drawerBonaPasogit');
  var alamatEl = document.getElementById('drawerAlamat');
  var waLinkEl = document.getElementById('drawerWaLink');

  if (nameEl) nameEl.textContent = member.Nama;
  if (avatarEl) avatarEl.src = member.FotoURL || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100';
  if (rumpunEl) rumpunEl.textContent = member.Rumpun || 'Hutagurgur';
  if (sundutEl) sundutEl.textContent = 'Sundut ke-' + (member.Generasi || 16);
  if (ktaEl) ktaEl.textContent = 'KTA: ' + member.MemberID;
  if (selfNameEl) selfNameEl.textContent = member.Nama;
  if (pasanganEl) pasanganEl.textContent = member.SpouseID ? ('Pasangan: ' + member.SpouseID) : 'Belum menikah';
  if (pekerjaanEl) pekerjaanEl.textContent = member.Pekerjaan || '-';
  if (bonaPasogitEl) bonaPasogitEl.textContent = member.BonaPasogit || 'Sibisa, Toba';
  if (alamatEl) alamatEl.textContent = member.Alamat || '-';

  if (waLinkEl && member.NoHP) {
    waLinkEl.href = 'https://wa.me/' + member.NoHP.replace(/\D/g, '');
  }

  // Cari Ayah & Ompung
  var ayah = AppState.members.find(function(m) { return m.MemberID === member.ParentID; });
  if (ayah) {
    if (ayahNameEl) ayahNameEl.textContent = ayah.Nama + ' (Sundut ' + ayah.Generasi + ')';
    var ompung = AppState.members.find(function(m) { return m.MemberID === ayah.ParentID; });
    if (ompungNameEl) {
      ompungNameEl.textContent = ompung ? (ompung.Nama + ' (Sundut ' + ompung.Generasi + ')') : 'Ompu Tahan Manurung';
    }
  } else {
    if (ayahNameEl) ayahNameEl.textContent = 'St. Marulam Manurung';
    if (ompungNameEl) ompungNameEl.textContent = 'Ompu Tahan Manurung';
  }

  renderMembersTable();
}

function populateRootSelect() {
  var sel = document.getElementById('treeRootSelect');
  if (!sel) return;
  var rootCandidates = AppState.members.filter(function(m) {
    return !m.ParentID || m.Generasi <= 2 || m.MemberID === 'MNR-ROOT-001';
  });
  if (rootCandidates.length === 0) rootCandidates = AppState.members.slice(0, 3);

  sel.innerHTML = rootCandidates.map(function(m) {
    return '<option value="' + m.MemberID + '">' + escapeHtml(m.Nama) + ' (G-' + m.Generasi + ')</option>';
  }).join('');
}

function renderFamilyTree() {
  var container = document.getElementById('treeContainer');
  var svgEl = d3.select('#treeSvg');
  if (!container || !svgEl.node()) return;

  svgEl.selectAll('*').remove();

  var width = container.clientWidth || 900;
  var height = container.clientHeight || 580;

  var rootId = document.getElementById('treeRootSelect')?.value || 'MNR-ROOT-001';
  var rootMember = AppState.members.find(function(m) { return m.MemberID === rootId; }) || AppState.members[0];

  if (!rootMember) return;

  // Build Hierarchical JSON from flat ParentID
  function buildHierarchy(member) {
    var children = AppState.members.filter(function(m) {
      return m.ParentID === member.MemberID;
    });
    return {
      data: member,
      children: children.map(buildHierarchy)
    };
  }

  var treeData = buildHierarchy(rootMember);
  var rootNode = d3.hierarchy(treeData);

  var treeLayout = d3.tree().nodeSize([210, 140]);
  treeLayout(rootNode);

  var svg = svgEl.attr('viewBox', [0, 0, width, height]);
  var g = svg.append('g').attr('id', 'treeGroup');

  // Zoom Setup
  AppState.treeZoom = d3.zoom()
    .scaleExtent([0.25, 2.5])
    .on('zoom', function(event) {
      g.attr('transform', event.transform);
    });

  svg.call(AppState.treeZoom);

  // Initial Center Position
  var initialTransform = d3.zoomIdentity.translate(width / 2, 70).scale(0.85);
  svg.call(AppState.treeZoom.transform, initialTransform);

  // Draw Curved Links
  g.selectAll('.tree-link')
    .data(rootNode.links())
    .enter()
    .append('path')
    .attr('class', 'tree-link solid')
    .attr('d', d3.linkVertical()
      .x(function(d) { return d.x; })
      .y(function(d) { return d.y; })
    );

  // Draw Node Containers
  var node = g.selectAll('.tree-node')
    .data(rootNode.descendants())
    .enter()
    .append('g')
    .attr('class', 'tree-node')
    .attr('transform', function(d) { return 'translate(' + d.x + ',' + d.y + ')'; })
    .on('click', function(event, d) {
      selectMemberById(d.data.data.MemberID);
      showToast('Anggota Dipilih', d.data.data.Nama);
    });

  // Node Background Card (ForeignObject for modern HTML card styling)
  node.append('foreignObject')
    .attr('width', 180)
    .attr('height', 85)
    .attr('x', -90)
    .attr('y', -30)
    .html(function(d) {
      var m = d.data.data;
      var borderColor = '#0e243a';
      var badgeBg = 'bg-primary-container text-white';

      if ((m.Rumpun || '').indexOf('Hutagaol') !== -1) {
        borderColor = '#b6191a';
        badgeBg = 'bg-secondary text-white';
      } else if ((m.Rumpun || '').indexOf('Simanoroni') !== -1) {
        borderColor = '#d97706';
        badgeBg = 'bg-amber-600 text-white';
      }

      return '<div style="border-left: 4px solid ' + borderColor + ';" class="w-full h-full bg-white rounded-xl shadow-md p-2 flex flex-col justify-between border border-slate-200">' +
        '<div class="flex items-center gap-2">' +
          '<img src="' + (m.FotoURL || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=80') + '" class="w-7 h-7 rounded-full object-cover shrink-0">' +
          '<div class="min-w-0 flex-1">' +
            '<h5 class="text-[11px] font-bold text-slate-900 truncate leading-tight">' + escapeHtml(m.Nama) + '</h5>' +
            '<span class="text-[9px] text-slate-500 font-semibold block">Sundut ' + m.Generasi + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="flex items-center justify-between text-[9px] pt-1 border-t border-slate-100">' +
          '<span class="px-1.5 py-0.2 rounded ' + badgeBg + ' font-bold truncate max-w-[100px]">' + escapeHtml(m.Rumpun || 'Silau Raja') + '</span>' +
          '<span class="text-slate-400 font-mono text-[8px]">' + (m.JenisKelamin === 'L' ? 'Laki-laki' : 'Boru') + '</span>' +
        '</div>' +
      '</div>';
    });
}

function openEditUserModal(email) {
  var u = AppState.users.find(function(x) { return x.Email === email; });
  if (!u) return;
  var nama = prompt('Edit Nama untuk ' + email + ':', u.Nama || '');
  if (nama === null) return;
  var memberId = prompt('Edit MemberID:', u.MemberID || '');
  if (memberId === null) return;
  var status = prompt('Status (Aktif / NonAktif):', u.Status || 'Aktif');
  if (status === null) return;
  if (AppState.isGasEnvironment) {
    google.script.run
      .withSuccessHandler(function() {
        showToast('Pengguna Diperbarui', email + ' berhasil diperbarui.');
        initApp();
      })
      .withFailureHandler(function(err) { showToast('Error', err.message); })
      .updateUserInfo(email, { Nama: nama, MemberID: memberId, Status: status });
  } else {
    u.Nama = nama; u.MemberID = memberId; u.Status = status;
    renderRoleUsersTable();
    showToast('Pengguna Diperbarui', email + ' (Demo Mode)');
  }
}

function promptResetPassword(email) {
  var pw = prompt('Password baru untuk ' + email + ' (min 6 karakter):', '');
  if (pw === null || pw === '') return;
  if (AppState.isGasEnvironment) {
    google.script.run
      .withSuccessHandler(function() {
        showToast('Password Direset', 'Password ' + email + ' berhasil diganti.');
      })
      .withFailureHandler(function(err) { showToast('Error', err.message); })
      .resetUserPassword(email, pw);

    showToast('Password Direset', email + ' (Demo Mode)');
  }
}

  var list = document.getElementById('loginLogsList');
  if (!list) return;
  list.innerHTML = '<p class="text-xs text-on-surface-variant">Memuat riwayat login...</p>';

    google.script.run
      .withSuccessHandler(function(logs) {
        if (!logs || !logs.length) {
          list.innerHTML = '<p class="text-xs text-on-surface-variant">Belum ada riwayat login tercatat.</p>';
          return;
        }
        list.innerHTML = logs.map(function(l) {
          return '<div class="p-2.5 bg-surface-container-low rounded-xl flex items-center justify-between text-xs border border-surface-container-high">' +
            '<span class="font-bold text-primary">' + escapeHtml(l.Email || '') + '</span>' +
            '<span class="text-[10px] text-on-surface-variant">' + escapeHtml(l.Timestamp || '') + '</span>' +
          '</div>';

      .withFailureHandler(function(err) {

    list.innerHTML = '<p class="text-xs text-on-surface-variant">Mode demo — riwayat login tidak tersedia.</p>';
  }
}

function changeUserRole(email, newRole) {
  if (AppState.isGasEnvironment) {

function searchTaromboCandidates(query) {
  var resultsEl = document.getElementById('taromboSearchResults');
  if (!resultsEl) return;
  var q = (query || '').toLowerCase();

  var matches = AppState.members.filter(function(m) {
    return !q || m.Nama.toLowerCase().indexOf(q) !== -1 || m.MemberID.toLowerCase().indexOf(q) !== -1;
  });

  resultsEl.innerHTML = matches.map(function(m) {
    return '<div class="p-3 bg-surface-container-low hover:bg-surface-container rounded-xl flex items-center justify-between gap-3 border border-surface-container-high transition">' +
      '<div>' +
        '<h4 class="font-bold text-xs text-primary">' + escapeHtml(m.Nama) + '</h4>' +
        '<span class="text-[10px] text-on-surface-variant">' + escapeHtml(m.Rumpun || '') + ' • Sundut ' + m.Generasi + ' • ' + escapeHtml(m.MemberID) + '</span>' +
      '</div>' +
      '<button type="button" onclick="selectFoundTarombo(\'' + m.MemberID + '\', \'' + escapeHtml(m.Nama) + '\')" class="px-3 py-1 bg-primary text-white text-[10px] font-semibold rounded-lg hover:bg-primary-container">' +
        'Pilih Sebagai Parent' +

// ============================================================================
// UI UTILITIES & TOAST
// ============================================================================
function openModal(modalId) {
  var el = document.getElementById(modalId);
  if (el) el.classList.remove('hidden');
}

function closeModal(modalId) {
  var el = document.getElementById(modalId);
  if (el) el.classList.add('hidden');
}

function showToast(title, message) {
  var toast = document.getElementById('toastNotification');
  var titleEl = document.getElementById('toastTitle');
  var msgEl = document.getElementById('toastMessage');
  if (!toast) return;

  if (titleEl) titleEl.textContent = title;
  if (msgEl) msgEl.textContent = message;

  toast.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
  setTimeout(function() {
    toast.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
  }, 3500);
}

function handleGlobalSearch(query) {
  if (AppState.currentTab !== 'data-anggota') {
    switchViewTab('data-anggota');
  }
  var input = document.getElementById('filterMemberSearch');
  if (input) {
    input.value = query;
    applyMemberFilters();
  }
}

function escapeHtml(text) {
  if (!text) return '';
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
